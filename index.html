function renderHome(){let acc=st.attemptedS?Math.round(st.correctS/st.attemptedS*100):0;$('#v-home').innerHTML=`<div class="card hero"><div><span class="tag blue">EXAM PREP PRO · TRUE/FALSE</span><h2>LIVE 9–10 · Phát biểu Đúng/Sai VIP</h2><p>Hệ luyện chuyên sâu theo đúng kiểu câu hỏi 4 phát biểu: chọn <b>Đúng/Sai cho từng ý</b>, kiểm tra ngay, chữa từng phát biểu, truy lỗi kiến thức và luyện lại vùng yếu.</p><div class="memoryStrip"><span>8 dạng</span><span>800 câu</span><span>400 cơ bản</span><span>400 nâng cao</span><span>30 câu bám sát file</span></div><button class="btn primary" onclick="nav('practice')">Bắt đầu luyện</button> <button class="btn secondary" onclick="nav('source')">Làm câu từ file</button></div><div class="heroVisual"><div class="atom"><div class="nucleus">p⁺ · n⁰</div></div></div></div><div class="grid g4" style="margin-top:15px"><div class="card stat"><strong>800</strong><span>câu đúng/sai luyện tập</span></div><div class="card stat"><strong>${st.attemptedQ}</strong><span>câu đã làm</span></div><div class="card stat"><strong>${acc}%</strong><span>độ chính xác theo phát biểu</span></div><div class="card stat"><strong>${st.wrong.length}</strong><span>câu cần ôn lại</span></div></div><div class="card" style="margin-top:15px"><h3>Bản đồ kiểm tra phát biểu</h3><table class="formula-table"><tr><th>Thấy từ khóa</th><th>Kiểm quy tắc</th><th>Tự hỏi ngược</th></tr><tr><td>“trung hòa”, “điện tích”</td><td class="miniEq">p=e=Z</td><td>Nếu đổi p mà e không đổi, còn trung hòa không?</td></tr><tr><td>“số khối”, “đồng vị”</td><td class="miniEq">A=Z+N</td><td>Phát biểu đang nhầm A với Z/N?</td></tr><tr><td>“orbital”, “phân lớp”</td><td class="miniEq">1 AO ≤2e</td><td>Đang nói AO hay cả phân lớp?</td></tr><tr><td>“cấu hình e”, “ion”</td><td class="miniEq">tổng e=Z±q</td><td>Ion mất/nhận electron ở đâu trước?</td></tr></table></div>`}
function renderPractice(){const group=live=>modules.filter(m=>m.live===live).map((m,i)=>`<div class="card module"><div class="num">${m.live===9?i+1:i+5}</div><div><span class="tag ${live===9?'live9':'live10'}">LIVE ${live}</span></div><h3>${m.icon} ${m.title}</h3><p>${m.focus}</p><div class="formulaHero"><small>QUY TẮC CỐT LÕI</small><div class="formulaBig">${m.formula}</div></div><div class="memoryStrip"><span>50 cơ bản</span><span>50 nâng cao</span><span>4 phát biểu/câu</span></div><div class="actions"><button class="btn secondary" onclick="openTheory('${m.id}')">Cốt lõi</button><button class="btn primary" onclick="startModule('${m.id}','basic')">Cơ bản</button><button class="btn purpleBtn" onclick="startModule('${m.id}','advanced')">Nâng cao</button><button class="btn success" onclick="startModule('${m.id}','all')">Đủ 100</button></div></div>`).join('');$('#v-practice').innerHTML=`<div class="pagehead"><div><h2>8 dạng · 800 câu Đúng/Sai</h2><p>Mỗi câu có 4 phát biểu độc lập. Hệ thống chấm từng ý và giải thích vì sao Đúng/Sai.</p></div></div><div class="liveBlock"><h3>LIVE 9 · BỘ CÂU HỎI PHÁT BIỂU ĐÚNG SAI – VIP 1</h3></div><div class="grid g2">${group(9)}</div><div class="liveBlock"><h3>LIVE 10 · BỘ CÂU HỎI PHÁT BIỂU ĐÚNG SAI – VIP 2</h3></div><div class="grid g2">${group(10)}</div>`}
function openTheory(id){let m=modules.find(x=>x.id===id);openModal(`<span class="tag ${m.live===9?'live9':'live10'}">LIVE ${m.live}</span><h2>${m.icon} ${m.title}</h2><div class="formulaHero"><h3>Quy tắc cốt lõi</h3><div class="formulaBig">${m.formula}</div></div><div class="formulaGrid"><div class="fbox"><h4>🔎 Khi nào dùng?</h4><p>${m.when}</p></div><div class="fbox"><h4>↩ Tư duy ngược Đ/S</h4><p>Đừng hỏi “câu này nghe quen không?”. Hãy hỏi: <b>Nếu phát biểu đúng thì quy tắc nào bắt buộc phải đúng theo?</b> Sau đó thử tìm một phản ví dụ.</p></div><div class="fbox"><h4>⚠️ Bẫy dễ sai</h4><p>${m.trap}</p></div></div>`)}
function startModule(mid,mode){let list=BANK.filter(q=>q.module===mid&&(mode==='all'||(mode==='basic'?q.level==='Cơ bản':q.level==='Nâng cao')));quiz={list,idx:0,answers:[null,null,null,null],checked:false,title:modules.find(m=>m.id===mid).title};navQuiz()}
function renderSource(){let s9=sourceQuestions.filter(q=>q.live===9),s10=sourceQuestions.filter(q=>q.live===10);const cards=a=>a.map((q,i)=>`<div class="card sourceQ"><span class="tag ${q.live===9?'live9':'live10'}">LIVE ${q.live} · câu ${i+1}</span><h3>${esc(q.stem)}</h3><p class="muted">${modules.find(m=>m.id===q.module).title}</p><div class="actions"><button class="btn secondary" onclick="startOneSource('${q.id}')">Làm câu này</button></div></div>`).join('');$('#v-source').innerHTML=`<div class="pagehead"><div><h2>30 câu bám sát file LIVE 9–10</h2><p>15 câu đại diện VIP1 + 15 câu đại diện VIP2. Mỗi câu vẫn giữ cấu trúc 4 phát biểu Đúng/Sai.</p></div><button class="btn primary" onclick="startSourceAll()">Luyện cả 30</button></div><div class="liveBlock"><h3>LIVE 9 · VIP 1</h3></div><div class="sourcegrid">${cards(s9)}</div><div class="liveBlock"><h3>LIVE 10 · VIP 2</h3></div><div class="sourcegrid">${cards(s10)}</div>`}
function startSourceAll(){quiz={list:[...sourceQuestions],idx:0,answers:[null,null,null,null],checked:false,title:'30 câu từ file LIVE 9–10'};navQuiz()}function startOneSource(id){let q=sourceQuestions.find(x=>x.id===id);quiz={list:[q],idx:0,answers:[null,null,null,null],checked:false,title:'Câu từ file LIVE '+q.live};navQuiz()}function navQuiz(){$$('.view').forEach(x=>x.classList.remove('active'));$('#v-quiz').classList.add('active');renderQuiz();scrollTo({top:0})}
function reverseThinking(q){let m=modules.find(x=>x.id===q.module);return `<details class="analysisBox" open><summary>🧠 Phân tích phát biểu · Tư duy ngược</summary><div class="analysisBody"><div class="analysisGrid"><div class="analysisCard"><h4>1. Khoanh từ khóa quyết định</h4><p>Tìm các từ như <b>luôn, chỉ, mọi, tối đa, trung hòa, số khối, lớp ngoài cùng</b>. Đây thường là nơi phát biểu bị “bẻ sai”.</p><h4>2. Kéo về quy tắc gốc</h4><p>${esc(m.formula)}</p></div><div class="analysisCard"><h4>↩ 3. Tư duy ngược</h4><div class="analysisArrow">Phát biểu đúng? ← quy tắc bắt buộc ← dữ kiện đề ← thử phản ví dụ</div><p>Nếu chỉ cần tìm được <b>một phản ví dụ hợp lệ</b>, phát biểu mang tính tuyệt đối sẽ Sai.</p></div></div><div class="analysisHint"><b>Bẫy của dạng:</b> ${esc(m.trap)}</div></div></details>`}
function renderQuiz(){let q=quiz.list[quiz.idx];if(!q){nav('home');return}let m=modules.find(x=>x.id===q.module);$('#v-quiz').innerHTML=`<div class="qwrap"><div class="pagehead"><div><h2>${esc(quiz.title)}</h2><p>Câu ${quiz.idx+1}/${quiz.list.length} · Chọn Đúng/Sai cho đủ 4 ý · Enter để kiểm tra/chuyển</p></div><button class="btn secondary" onclick="nav('practice')">← Thoát</button></div><div class="card"><div class="qmeta"><span class="tag ${m.live===9?'live9':'live10'}">LIVE ${m.live}</span><span class="tag blue">${esc(q.level)}</span>${q.source?'<span class="tag amber">Từ file</span>':''}<span class="tag purple">${esc(m.title)}</span></div><div class="qstem">${esc(q.stem)}</div>${reverseThinking(q)}<div id="statements">${q.statements.map((s,i)=>statementHTML(s,i)).join('')}</div><div id="fb"></div><div class="actionsRow"><button class="btn secondary" ${quiz.idx===0?'disabled':''} onclick="move(-1)">← Trước</button><div style="display:flex;gap:8px"><button class="btn primary" id="checkBtn" onclick="check()">Kiểm tra 4 ý</button><button class="btn secondary" onclick="move(1)">Sau →</button></div></div></div></div>`}
function statementHTML(s,i){let a=quiz.answers[i],cls='statement';if(quiz.checked)cls+=' '+(a===s.ans?'ok':'bad');return `<div class="${cls}"><div class="stTop"><div class="stLetter">${'abcd'[i]})</div><div><b>${esc(s.text)}</b>${quiz.checked?`<div class="why"><b>${s.ans?'ĐÚNG':'SAI'} ·</b> ${esc(s.why)}</div>`:''}</div><div class="tf"><button class="${a===true?'selT':''}" ${quiz.checked?'disabled':''} onclick="pickTF(${i},true)">Đúng</button><button class="${a===false?'selF':''}" ${quiz.checked?'disabled':''} onclick="pickTF(${i},false)">Sai</button></div></div></div>`}
function pickTF(i,v){if(quiz.checked)return;quiz.answers[i]=v;renderQuiz()}
function check(){let q=quiz.list[quiz.idx];if(quiz.checked){move(1);return}if(quiz.answers.some(x=>x===null)){toast('Hãy chọn Đúng/Sai cho đủ 4 phát biểu');return}quiz.checked=true;st.attemptedQ++;st.attemptedS+=4;let score=0;q.statements.forEach((s,i)=>{if(quiz.answers[i]===s.ans)score++});st.correctS+=score;st.xp+=score*3+(score===4?8:0);if(score<4&&!st.wrong.some(x=>x.id===q.id))st.wrong.push({...q,chosen:[...quiz.answers]});st.done[q.module]=Math.min(100,(st.done[q.module]||0)+(score===4?2:score*.3));save();updateTop();renderQuiz();$('#fb').innerHTML=`<div class="feedback ${score===4?'explain':'warning'}"><h3>${score===4?'✓ Hoàn toàn chính xác':`Đúng ${score}/4 phát biểu`}</h3><div class="scorebox"><div><strong>${score}</strong><span>ý đúng</span></div><div><strong>${4-score}</strong><span>ý sai</span></div><div><strong>${score*25}%</strong><span>điểm câu</span></div><div><strong>${score===4?'+20':`+${score*3}`}</strong><span>XP</span></div></div><p><b>Quy tắc cốt lõi:</b> ${esc(q.rule)}</p><p><b>Bẫy dễ sai:</b> ${esc(q.trap)}</p>${score<4?`<button class="btn purpleBtn" onclick="openGap('${q.module}')">Mở 5 câu tìm lỗ hổng</button>`:''}</div>`;$('#checkBtn').textContent='Câu tiếp →'}
function move(d){let ni=quiz.idx+d;if(ni<0)return;if(ni>=quiz.list.length){toast('Đã hoàn thành bộ câu hỏi');nav('report');return}quiz.idx=ni;quiz.answers=[null,null,null,null];quiz.checked=false;renderQuiz();scrollTo({top:0})}document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#v-quiz').classList.contains('active')){e.preventDefault();check()}})
const diag={
m1:[['Nguyên tử trung hòa có p=e?',true],['Neutron mang điện?',false],['A=p+n?',true],['Khối lượng tập trung ở hạt nhân?',true],['p=n với mọi nguyên tử?',false]],
m2:[['Đồng vị cùng Z?',true],['Đồng vị phải cùng A?',false],['N=A−Z?',true],['Điện tích hạt nhân phụ thuộc A?',false],['Hai đồng vị trung hòa cùng số e?',true]],
m3:[['M̄ là trung bình có trọng số?',true],['M̄ luôn nguyên?',false],['% số nguyên tử = % khối lượng trong mọi trường hợp?',false],['Cùng nguyên tố thì cùng Z?',true],['Khi đếm XY, số kiểu bằng tích số lựa chọn X·Y?',true]],
m4:[['Một AO tối đa 2e?',true],['Lớp n có n² AO?',true],['Lớp n tối đa 2n²e?',true],['Orbital là quỹ đạo tròn xác định?',false],['Phân lớp p có 3 AO?',true]],
m5:[['Tia âm cực là electron?',true],['Hạt nhân mang điện âm?',false],['Proton gần 1 amu?',true],['Neutron không mang điện?',true],['Electron chiếm phần lớn khối lượng nguyên tử?',false]],
m6:[['1Å=10⁻¹⁰m?',true],['Hạt nhân cùng cỡ nguyên tử?',false],['Theo Bohr electron ở lớp xa hơn thường năng lượng cao hơn?',true],['¹H có neutron?',false],['Các đồng vị H có cùng Z?',true]],
m7:[['s có 1 AO?',true],['p có 6 AO?',false],['d chứa tối đa 10e?',true],['Hai e cùng AO phải ngược spin?',true],['Hund ưu tiên ghép đôi trước?',false]],
m8:[['Tổng e nguyên tử trung hòa bằng Z?',true],['Na⁺ có nhiều e hơn Na?',false],['Al là nguyên tố p?',true],['Cl có 7e lớp ngoài cùng?',true],['Fe³⁺ vẫn giữ 4s²?',false]]};
function openGap(mid){let qs=diag[mid];openModal(`<span class="tag purple">Chữa lỗi 5 bước</span><h2>Tự tìm lỗ hổng · ${modules.find(m=>m.id===mid).title}</h2><p class="muted">Mỗi bước chỉ hỏi một mệnh đề nền tảng. Hãy trả lời rồi xem phản hồi ngay.</p>${qs.map((q,i)=>`<div class="diagq"><b>Bước ${i+1}/5</b><p>${q[0]}</p><div class="diagopts"><button class="diagopt" onclick="diagChoose(this,true,${q[1]})">Đúng</button><button class="diagopt" onclick="diagChoose(this,false,${q[1]})">Sai</button></div></div>`).join('')}`)}function diagChoose(btn,val,ans){let box=btn.closest('.diagopts');[...box.children].forEach(x=>x.disabled=true);btn.classList.add(val===ans?'good':'bad');if(val!==ans)[...box.children].find(x=>(x.textContent.trim()==='Đúng')===ans).classList.add('good')}
function renderWrong(){let a=st.wrong;$('#v-wrong').innerHTML=`<div class="pagehead"><div><h2>Sổ câu sai</h2><p>Những câu có ít nhất một phát biểu sai được lưu lại để ôn đúng lỗ hổng.</p></div><button class="btn secondary" onclick="if(confirm('Xóa sổ câu sai?')){st.wrong=[];save();renderWrong();updateTop()}">Xóa sổ</button></div>${a.length?a.map((q,i)=>`<div class="wrongitem"><span class="tag red">Lỗi ${i+1}</span><h3>${esc(q.stem)}</h3><p><b>Quy tắc:</b> ${esc(q.rule)}</p><p><b>Bẫy:</b> ${esc(q.trap)}</p><button class="btn purpleBtn" onclick="openGap('${q.module}')">Luyện 5 bước</button> <button class="btn secondary" onclick="startWrong('${q.id}')">Làm lại câu</button></div>`).join(''):'<div class="card"><h3>Chưa có câu sai 🎯</h3><p class="muted">Làm bài để hệ thống tự xây sổ lỗi.</p></div>'}`}
function startWrong(id){let q=st.wrong.find(x=>x.id===id);quiz={list:[q],idx:0,answers:[null,null,null,null],checked:false,title:'Luyện lại câu sai'};navQuiz()}
function renderReport(){let acc=st.attemptedS?Math.round(st.correctS/st.attemptedS*100):0;$('#v-report').innerHTML=`<div class="pagehead"><div><h2>Báo cáo tiến độ</h2><p>Dữ liệu lưu cục bộ bằng localStorage.</p></div></div><div class="grid g4"><div class="card stat"><strong>${st.attemptedQ}</strong><span>câu đã làm</span></div><div class="card stat"><strong>${st.attemptedS}</strong><span>phát biểu đã chấm</span></div><div class="card stat"><strong>${acc}%</strong><span>độ chính xác</span></div><div class="card stat"><strong>${st.xp}</strong><span>XP</span></div></div><div class="card" style="margin-top:15px"><h3>Mastery theo dạng</h3>${modules.map(m=>`<div style="margin:13px 0"><div style="display:flex;justify-content:space-between;gap:10px"><b>${m.icon} LIVE ${m.live} · ${m.title}</b><span>${Math.round(st.done[m.id]||0)}%</span></div><div class="progress"><span style="width:${Math.min(100,st.done[m.id]||0)}%"></span></div></div>`).join('')}</div>`}
genBank();updateTop();renderHome();
</script></body></html>
